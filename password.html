<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>文化祭シフト管理 - ログイン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f5f2;
        }

        .login-container {
            width: min(90%, 420px);
            padding: 35px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 25px;
        }

        .description {
            margin-bottom: 25px;
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            text-align: left;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #888;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            min-height: 24px;
            margin-top: 15px;
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="icon">🔐</div>

        <h1>🎪 文化祭シフト管理</h1>

        <p class="description">
            システムを利用するには<br>
            パスワードを入力してください。
        </p>

        <form id="loginForm">

            <label for="password">
                パスワード
            </label>

            <input
                id="password"
                type="password"
                autocomplete="off"
                placeholder="パスワードを入力"
                required
            >

            <button type="submit">
                🔓 ログイン
            </button>

            <p id="errorMessage" class="error"></p>

        </form>

    </div>

    <script src="password.js"></script>

</body>

</html>
